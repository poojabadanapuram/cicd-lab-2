
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check HTML File
        run: |
          echo "Checking HTML file..."
          test -f index.html
          echo "HTML file exists successfully!"

      - name: Build Completed
        run: echo "CI Pipeline Executed Successfully"
